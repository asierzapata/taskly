# fly.toml app configuration file generated for taskly on 2023-07-17T17:15:33+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "taskly"
primary_region = "mad"

[env]
	NODE_ENV="production"
	NODE_PATH="../../node_modules:./node_modules:./src"
	PORT="8080"
	LOGGING_ENABLED="true"
	LOGGING_LEVEL="info"
	JWT_ALGORITHM="HS256"
	JWT_EXPIRATION="86400000"
	JWT_SECRET=""
	JWT_COOKIE_NAME="taskly-auth"
	MONGODB_URI=""
	MONGODB_DATA_DB_NAME="data"
	MONGODB_USER_DB_NAME="user"
	GOOGLE_CLIENT_ID=""
	GOOGLE_CLIENT_SECRET=""
	GOOGLE_REDIRECT_URL=""
	NUTS_GITHUB_API_KEY=""
	NUTS_REFRESH_SECRET=""


[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
