name: 📦 Publish Desktop App
run-name: ${{ inputs.platform }} -- ${{ inputs.channel }} -- ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        required: true
        description: Platform to build for
        options:
          - macos-latest
          - windows-latest
          - ubuntu-latest
      channel:
        type: choice
        required: true
        description: Build channel to use
        default: 'production'
        options:
          - beta
          - production
      version:
        type: choice
        required: true
        description: Version increment
        default: 'patch'
        options:
          - major
          - minor
          - patch

# You can leverage Vercel Remote Caching with Turbo to speed up your builds
# @link https://turborepo.org/docs/core-concepts/remote-caching#remote-caching-on-vercel-builds
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  publish:
    runs-on: ${{ inputs.platform }}

    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v3

      - name: 🏗 Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18.17.0
          cache: yarn

      - name: 🏗 Install deps (with cache)
        run: yarn install

      - name: ⬆️ Bump version
        run: yarn workspace @taskly/desktop version --${{ inputs.version }}

      - name: 🛠️ Build, Make and Publish
        run: CHANNEL=${{ inputs.channel }} yarn workspace @taskly/desktop app:publish

      - name: 📦 Update Release Notes
        uses: actions/github-script@v6
        with:
          script: |
            // Get all the commits since the last release
            // and update the release name with the channel
            const release = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const commits = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `${release.data.tag_name}...${context.sha}`,
            });
            const releaseNotes = commits.data.commits.map((commit) => {
              return `- ${commit.commit.message}`;
            });
            const channel = ${{ inputs.channel }};
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              name: `${release.data.name}-${channel}`,
              body: releaseNotes.join('\n'),
            });
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 💾 Commit & Push changes
        uses: actions-js/push@master
        with:
          message: Release ${{ inputs.channel }} ${{ inputs.version }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
